[package]
name = "stelly-provider"
version = "0.2.1"
edition = "2021"
description = "What Stelly asks a music provider for, and how: the catalogue's types, the provider protocol, and a client of it, async or blocking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nab-os/stelly-provider"

[features]
# The types and the protocol alone, by default: what a provider shares.
default = []
# A client on reqwest, for async callers such as Stelly's server.
async = ["dep:reqwest", "dep:rustls"]
# A client on ureq, for blocking callers.
blocking = ["dep:ureq"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"], optional = true }
# Never named in the source: reqwest takes rustls with default features off,
# which drops `prefer-post-quantum` and leaves X25519MLKEM768 advertised in
# `supported_groups` with no matching key share. A server that prefers that
# group then has to answer with a HelloRetryRequest, and an ingress that
# mishandles one closes the connection mid-handshake. Naming rustls turns the
# feature back on through unification.
rustls = { version = "0.23.45", default-features = false, features = ["prefer-post-quantum"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"], optional = true }
